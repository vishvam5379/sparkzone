{% extends 'base.html' %}
{% block title %}Login – SparkZone{% endblock %}

{% block content %}
<div style="margin-top:72px;min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:48px 24px;background:#080b11;">
  <div style="width:100%;max-width:440px;">
    
    <div style="text-align:center;margin-bottom:28px;">
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.85rem;font-weight:700;color:#f0f4f8;letter-spacing:-0.02em;margin-bottom:6px;">Welcome Back</h1>
      <p style="color:#8896a8;font-size:0.92rem;">Sign in to your SparkZone gaming account</p>
    </div>

    <div class="form-card" style="padding:28px;background:#0f141d;border:1px solid #1e2638;border-radius:14px;">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:18px;">
          <label for="login-email" class="form-label" style="display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:#cbd5e1;margin-bottom:6px;">
            <i class="ti ti-mail" style="color:#00f0ff;"></i> Email Address
          </label>
          <input type="email" name="email" id="login-email" class="form-control" placeholder="you@example.com" required autocomplete="email" style="background:#141b27;border-color:#1e293b;color:#f0f4f8;" />
        </div>
        
        <div class="form-group" style="margin-bottom:22px;">
          <label for="login-pass" class="form-label" style="display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:#cbd5e1;margin-bottom:6px;">
            <i class="ti ti-lock" style="color:#00f0ff;"></i> Password
          </label>
          <div style="position:relative;">
            <input type="password" name="password" id="login-pass" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="background:#141b27;border-color:#1e293b;color:#f0f4f8;padding-right:44px;" />
            <button type="button" onclick="togglePwd('login-pass', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8896a8;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;" aria-label="Toggle password visibility">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;padding:12px;font-size:0.95rem;">
          <i class="ti ti-login"></i> Sign In
        </button>
      </form>

      <div class="form-divider" style="margin:20px 0;display:flex;align-items:center;gap:12px;color:#64748b;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">
        <span style="flex:1;height:1px;background:#1e2638;"></span>
        <span>or continue with</span>
        <span style="flex:1;height:1px;background:#1e2638;"></span>
      </div>

      <a href="{% url 'google_login' %}" class="btn btn-secondary btn-lg" style="width:100%;justify-content:center;margin-bottom:18px;gap:10px;background:#141b27;border-color:#1e293b;color:#f0f4f8;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.1-6.68-4.93H1.36v3.15C3.33 21.28 7.39 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.36c-.8 1.6-1.26 3.41-1.26 5.42s.46 3.82 1.26 5.42l3.96-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.33 2.72 1.36 6.58l3.96 3.15c.94-2.83 3.57-4.98 6.68-4.98z"/></svg>
        Sign in with Google
      </a>

      <p style="text-align:center;color:#8896a8;font-size:0.88rem;margin:0;">
        Don't have an account?
        <a href="{% url 'register' %}" style="color:#00f0ff;font-weight:600;text-decoration:none;">Create one free →</a>
      </p>
    </div>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass ? '<i class="ti ti-eye-off"></i>' : '<i class="ti ti-eye"></i>';
}
</script>
{% endblock %}
