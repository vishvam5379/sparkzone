{% extends 'base.html' %}
{% block title %}Sign in with Google – SparkZone{% endblock %}

{% block content %}
<div style="margin-top:70px;min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:40px 24px;
            background:radial-gradient(ellipse 60% 60% at 50% 30%, rgba(66,133,244,.12), transparent);">
  <div style="width:100%;max-width:440px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;background:var(--bg3);border:1px solid var(--border);border-radius:50%;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);">
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.1-6.68-4.93H1.36v3.15C3.33 21.28 7.39 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.36c-.8 1.6-1.26 3.41-1.26 5.42s.46 3.82 1.26 5.42l3.96-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.33 2.72 1.36 6.58l3.96 3.15c.94-2.83 3.57-4.98 6.68-4.98z"/></svg>
      </div>
      <h1 style="font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:800;margin-bottom:6px;color:var(--text);">Google Account Sign In</h1>
      <p style="color:var(--muted);font-size:.9rem;">Enter your Gmail account to sign in to SparkZone</p>
    </div>

    <div class="form-card" style="border-top:3px solid #4285F4;">
      <form method="GET" action="{% url 'google_login' %}">
        <div class="form-group">
          <label for="google-email" style="font-weight:600;color:var(--text);"><i class="fa-solid fa-envelope" style="margin-right:6px;color:#4285F4;"></i>Your Gmail Address</label>
          <input type="email" name="email" id="google-email" placeholder="username@gmail.com" required autocomplete="email" style="border-color:rgba(66,133,244,.4);" />
        </div>

        <div class="form-group">
          <label for="google-name" style="font-weight:600;color:var(--text);"><i class="fa-solid fa-user" style="margin-right:6px;color:#4285F4;"></i>Your Full Name</label>
          <input type="text" name="name" id="google-name" placeholder="Vishvam Sukhadiya" required style="border-color:rgba(66,133,244,.4);" />
        </div>

        <button type="submit" class="btn" style="width:100%;justify-content:center;font-size:1rem;padding:14px;background:#4285F4;color:#fff;border-radius:12px;font-weight:700;margin-top:8px;box-shadow:0 4px 14px rgba(66,133,244,.4);transition:all .2s;" onmouseover="this.style.background='#3367D6'" onmouseout="this.style.background='#4285F4'">
          <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px;"><path fill="#fff" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#fff" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.1-6.68-4.93H1.36v3.15C3.33 21.28 7.39 24 12 24z"/><path fill="#fff" d="M5.32 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.36c-.8 1.6-1.26 3.41-1.26 5.42s.46 3.82 1.26 5.42l3.96-3.15z"/><path fill="#fff" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.33 2.72 1.36 6.58l3.96 3.15c.94-2.83 3.57-4.98 6.68-4.98z"/></svg>
          Sign in with Google
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;">
        <a href="{% url 'login' %}" style="color:var(--muted);font-size:.85rem;text-decoration:none;">← Return to Standard Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
