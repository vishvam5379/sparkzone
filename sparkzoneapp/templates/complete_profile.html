{% extends 'base.html' %}
{% block title %}Complete Your Profile – SparkZone{% endblock %}

{% block content %}
<div style="margin-top:72px;min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:48px 24px;background:#080b11;">
  <div style="width:100%;max-width:680px;">
    
    <div style="text-align:center;margin-bottom:32px;">
      <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.25);color:#00f0ff;font-size:0.8rem;font-weight:600;margin-bottom:12px;">
        <i class="ti ti-sparkles"></i> Welcome to SparkZone
      </div>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.85rem;font-weight:700;color:#f0f4f8;letter-spacing:-0.02em;margin-bottom:8px;">
        Welcome, {{ pending_user.firstName }}!
      </h1>
      <p style="color:#8896a8;font-size:0.95rem;">
        Choose your account role to complete your profile setup.
      </p>
    </div>

    <form method="POST" action="{% url 'complete_profile' %}">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:20px;margin-bottom:28px;">
        
        <!-- Gamer Choice Card -->
        <label id="card-gamer" style="background:#0f141d;border:2px solid #00f0ff;border-radius:14px;padding:24px;cursor:pointer;transition:all 0.15s ease;display:flex;flex-direction:column;position:relative;" onclick="selectRole('user')">
          <input type="radio" name="role" value="user" id="role-user" checked style="position:absolute;top:20px;right:20px;accent-color:#00f0ff;width:20px;height:20px;" />
          
          <div style="width:48px;height:48px;border-radius:10px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.25);display:flex;align-items:center;justify-content:center;color:#00f0ff;font-size:1.4rem;margin-bottom:16px;">
            <i class="ti ti-device-gamepad-2"></i>
          </div>

          <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;color:#f0f4f8;margin-bottom:6px;">
            I am a Gamer
          </h3>
          <p style="color:#8896a8;font-size:0.88rem;line-height:1.5;margin-bottom:18px;">
            Book premium gaming stations, reserve slots at top local centers, and track all your gaming sessions.
          </p>

          <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:0.82rem;color:#cbd5e1;">
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Instant Station Reservations</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Gamer Booking & Wallet Hub</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Real-Time Slot Availability</div>
          </div>
        </label>

        <!-- Provider Choice Card -->
        <label id="card-provider" style="background:#0f141d;border:2px solid #1e2638;border-radius:14px;padding:24px;cursor:pointer;transition:all 0.15s ease;display:flex;flex-direction:column;position:relative;" onclick="selectRole('provider')">
          <input type="radio" name="role" value="provider" id="role-provider" style="position:absolute;top:20px;right:20px;accent-color:#00f0ff;width:20px;height:20px;" />

          <div style="width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid #1e2638;display:flex;align-items:center;justify-content:center;color:#8896a8;font-size:1.4rem;margin-bottom:16px;" id="provider-icon-box">
            <i class="ti ti-building-store"></i>
          </div>

          <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;color:#f0f4f8;margin-bottom:6px;">
            I am a Provider
          </h3>
          <p style="color:#8896a8;font-size:0.88rem;line-height:1.5;margin-bottom:18px;">
            List your gaming lounge or cyber cafe, manage systems & unit slots, approve requests, and maximize earnings.
          </p>

          <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:0.82rem;color:#cbd5e1;">
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Rig & System Unit Management</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Live Booking Requests Dashboard</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-check" style="color:#00f0ff;"></i> Real-Time Revenue Analytics</div>
          </div>
        </label>

      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;padding:14px;font-size:0.95rem;">
        Complete Profile & Continue <i class="ti ti-arrow-right"></i>
      </button>
    </form>

  </div>
</div>

<script>
  function selectRole(role) {
    const gamerCard = document.getElementById('card-gamer');
    const providerCard = document.getElementById('card-provider');
    const roleUser = document.getElementById('role-user');
    const roleProvider = document.getElementById('role-provider');
    const providerIcon = document.getElementById('provider-icon-box');

    if (role === 'provider') {
      roleProvider.checked = true;
      providerCard.style.borderColor = '#00f0ff';
      if (providerIcon) {
        providerIcon.style.color = '#00f0ff';
        providerIcon.style.background = 'rgba(0,240,255,0.1)';
        providerIcon.style.borderColor = 'rgba(0,240,255,0.25)';
      }
      gamerCard.style.borderColor = '#1e2638';
    } else {
      roleUser.checked = true;
      gamerCard.style.borderColor = '#00f0ff';
      providerCard.style.borderColor = '#1e2638';
      if (providerIcon) {
        providerIcon.style.color = '#8896a8';
        providerIcon.style.background = 'rgba(255,255,255,0.05)';
        providerIcon.style.borderColor = '#1e2638';
      }
    }
  }
</script>
{% endblock %}
