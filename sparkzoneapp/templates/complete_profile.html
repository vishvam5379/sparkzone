{% extends 'base.html' %}
{% block title %}Complete Your Profile – SparkZone{% endblock %}

{% block content %}
<div style="margin-top:70px;min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(ellipse 70% 70% at 50% 20%, rgba(124,58,237,.14), transparent);">
  <div style="width:100%;max-width:680px;">
    
    <div style="text-align:center;margin-bottom:32px;">
      <div class="badge" style="margin-bottom:12px;"><i class="fa-solid fa-sparkles"></i> Welcome to SparkZone</div>
      <h1 style="font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;margin-bottom:8px;line-height:1.3;">
        Welcome, {{ pending_user.firstName }}!
      </h1>
      <p style="color:var(--muted);font-size:0.95rem;">
        Choose your account role to set up your personalized experience.
      </p>
    </div>

    <form method="POST" action="{% url 'complete_profile' %}">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:20px;margin-bottom:28px;">
        
        <!-- Gamer Choice Card -->
        <label id="card-gamer" style="background:var(--card);border:2px solid var(--neon);border-radius:18px;padding:24px;cursor:pointer;transition:all .25s ease;display:flex;flex-direction:column;position:relative;box-shadow:0 0 20px rgba(0,212,255,0.15);" onclick="selectRole('user')">
          <input type="radio" name="role" value="user" id="role-user" checked style="position:absolute;top:18px;right:18px;accent-color:var(--neon);width:20px;height:20px;" />
          
          <div style="width:52px;height:52px;border-radius:14px;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.3);display:flex;align-items:center;justify-content:center;color:var(--neon);font-size:1.5rem;margin-bottom:16px;">
            <i class="fa-solid fa-gamepad"></i>
          </div>

          <h3 style="font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:8px;">
            I am a Gamer
          </h3>
          <p style="color:var(--muted);font-size:0.85rem;line-height:1.5;margin-bottom:16px;">
            Book premium gaming stations, reserve slots at top local centers, and track all your gaming sessions.
          </p>

          <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:0.8rem;color:var(--text);">
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--neon);font-size:0.75rem;"></i> Instant Station Reservations</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--neon);font-size:0.75rem;"></i> Gamer Booking & Wallet Hub</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--neon);font-size:0.75rem;"></i> Exclusive Local Tournaments</div>
          </div>
        </label>

        <!-- Provider Choice Card -->
        <label id="card-provider" style="background:var(--card);border:2px solid var(--border);border-radius:18px;padding:24px;cursor:pointer;transition:all .25s ease;display:flex;flex-direction:column;position:relative;" onclick="selectRole('provider')">
          <input type="radio" name="role" value="provider" id="role-provider" style="position:absolute;top:18px;right:18px;accent-color:var(--accent2);width:20px;height:20px;" />

          <div style="width:52px;height:52px;border-radius:14px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);display:flex;align-items:center;justify-content:center;color:var(--accent2);font-size:1.5rem;margin-bottom:16px;">
            <i class="fa-solid fa-store"></i>
          </div>

          <h3 style="font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:8px;">
            I am a Provider
          </h3>
          <p style="color:var(--muted);font-size:0.85rem;line-height:1.5;margin-bottom:16px;">
            List your gaming lounge or cyber cafe, manage systems & unit slots, approve requests, and maximize earnings.
          </p>

          <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:0.8rem;color:var(--text);">
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--accent2);font-size:0.75rem;"></i> Rig & System Unit Management</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--accent2);font-size:0.75rem;"></i> Live Booking Requests Dashboard</div>
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check" style="color:var(--accent2);font-size:0.75rem;"></i> Real-Time Revenue Analytics</div>
          </div>
        </label>

      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:15px;font-size:1.05rem;font-family:'Orbitron',monospace;letter-spacing:0.04em;">
        Complete Profile & Continue <i class="fa-solid fa-arrow-right" style="margin-left:8px;"></i>
      </button>
    </form>

  </div>
</div>

<script>
  function selectRole(role) {
    const gamerCard = document.getElementById('card-gamer');
    const providerCard = document.getElementById('card-provider');
    const roleUser = document.getElementById('role-user');
    const roleProvider = document.getElementById('role-provider');

    if (role === 'provider') {
      roleProvider.checked = true;
      providerCard.style.borderColor = 'var(--accent2)';
      providerCard.style.boxShadow = '0 0 20px rgba(168,85,247,0.2)';
      gamerCard.style.borderColor = 'var(--border)';
      gamerCard.style.boxShadow = 'none';
    } else {
      roleUser.checked = true;
      gamerCard.style.borderColor = 'var(--neon)';
      gamerCard.style.boxShadow = '0 0 20px rgba(0,212,255,0.15)';
      providerCard.style.borderColor = 'var(--border)';
      providerCard.style.boxShadow = 'none';
    }
  }
</script>
{% endblock %}
